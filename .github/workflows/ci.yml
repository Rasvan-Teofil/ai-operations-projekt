name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy sample and TF-IDF. No Hugging Face download, no fine-tuning.
      SENTIMENT_MODEL: tfidf_logreg
      SENTIMENT_DATA: dummy
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Deliberately only the TF-IDF models. --all and src.finetune load transformers.
      - name: Baseline trainieren
        run: python -m src.train

      - name: Run tests
        run: pytest

  second-path:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: second_path/requirements.txt

      # No CUDA torch. The tests check API, fetching and tokenisation, not training.
      - name: Install second-iteration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r second_path/requirements.txt

      - name: Check transformer import
        run: python -c "import transformers, tokenizers, fastapi, bs4, numpy"

      - name: Second-iteration tests
        run: pytest tests/secondpath -q
